<section class="hero" appScrollReveal>
  <div class="hero__inner">
    <div class="hero__text">
      <p class="hero__role">{{ i18n.dict().hero.role }}</p>
      <h1 class="hero__headline">{{ i18n.dict().hero.headline }}</h1>
      <p class="hero__subline">{{ i18n.dict().hero.subline }}</p>
    </div>

    <div class="hero__photo">
      <div class="hero__photo-frame" data-placeholder="hero photo">
        <img ngSrc="/images/photos/profile.png" fill alt="Oleksandra Kaplun" />
      </div>
    </div>
  </div>
</section>
