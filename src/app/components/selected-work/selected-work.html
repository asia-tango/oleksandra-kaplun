<section class="work" id="work" appScrollReveal>
  <div class="work__inner">
    <h2 class="work__heading">{{ i18n.dict().work.heading }}</h2>

    <div class="work__grid">
      @for (item of i18n.dict().work.items; track item.name; let i = $index) {
        <article class="work__card">
          <h3 class="work__card-name">{{ item.name }}</h3>
          <p class="work__card-stack">{{ item.stack }}</p>
          <p class="work__card-fact">{{ item.fact }}</p>

          <div class="work__card-links">
            @for (link of workLinks[i]; track link.label) {
              <a class="work__card-link" [href]="link.href" target="_blank" rel="noopener">
                @if (link.icon === 'github') {
                  <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path
                      d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"
                    />
                  </svg>
                } @else {
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                    <path d="M15 3h6v6" />
                    <path d="M10 14 21 3" />
                  </svg>
                }
                <span>{{ link.label }}</span>
              </a>
            }
          </div>
        </article>
      }
    </div>
  </div>
</section>
